<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XFG Lime Glass TikTok Frame</title>
    <link rel="stylesheet" href="./xfg-tiktok-lime-frame.css?v=8">
  </head>
  <body>
    <main class="xfg-tiktok-frame" aria-hidden="true">
      <div class="frame-stage">
        <img class="frame-art" src="./xfg-tiktok-lime-glass-frame.png?v=8" alt="">
        <div class="ambient-glow"></div>
        <div class="energy-field energy-field--stream"><i></i></div>
        <div class="energy-field energy-field--orbit"><i></i></div>
        <div class="energy-field energy-field--particles"><i></i></div>
        <span class="tiger-eye tiger-eye--left"></span>
        <span class="tiger-eye tiger-eye--right"></span>
        <span class="node-pulse node-pulse--top-left"></span>
        <span class="node-pulse node-pulse--top-right"></span>
        <span class="node-pulse node-pulse--mid-left"></span>
        <span class="node-pulse node-pulse--mid-right"></span>
        <span class="node-pulse node-pulse--bottom-left"></span>
        <span class="node-pulse node-pulse--bottom-right"></span>
        <div class="glass-sheen"><i></i></div>
        <div class="laser-pass"><i></i></div>
        <div class="circuit-chase circuit-chase--left"><i></i></div>
        <div class="circuit-chase circuit-chase--right"><i></i></div>
      </div>
    </main>
  </body>
</html>
