<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>XFG Lime Circuit TikTok Frame</title>
    <link rel="stylesheet" href="./xfg-tiktok-lime-frame.css?v=9">
    <script src="./xfg-tiktok-lime-frame.js?v=9" defer></script>
  </head>
  <body>
    <main class="xfg-tiktok-frame" aria-hidden="true">
      <div class="frame-stage">
        <img
          class="frame-art"
          src="./xfg-tiktok-lime-glass-frame.png?v=9"
          alt=""
          width="1080"
          height="1920"
          decoding="async"
        >
        <canvas
          id="xfg-energy-canvas"
          class="energy-canvas"
          width="1080"
          height="1920"
        ></canvas>
      </div>
    </main>
  </body>
</html>
